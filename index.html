<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0F0F0F">
<title>Plataforma de Evaluación 1 · Tela Peruana | ZEGEL Metodologías Ágiles</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E8001C;--red-dk:#B5001A;--red-lt:#FF1F38;
  --black:#0F0F0F;--black-mid:#1A1A1A;--black-soft:#242424;
  --bone:#F2EFE9;--bone-dk:#E5E1DA;
  --lime:#AAFF00;--lime-dk:#88CC00;
  --white:#FFFFFF;--gray:#6B6B6B;--gray-lt:#ABABAB;--ok:#0a7a45;
  --f-disp:'Syne',system-ui,sans-serif;--f-body:'Libre Baskerville',Georgia,serif;--f-mono:'JetBrains Mono',ui-monospace,monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f-body);background:var(--bone);color:var(--black);line-height:1.6}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
button{font:inherit;cursor:pointer}
.mono{font-family:var(--f-mono)}

/* NAV */
#nav{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:var(--black);color:var(--white);display:flex;align-items:center;gap:1rem;padding:0 1.2rem;border-bottom:3px solid var(--red)}
.logo{font-family:var(--f-disp);font-weight:800;letter-spacing:3px;font-size:1.05rem;white-space:nowrap}
.logo span{color:var(--red)}
.grp{font-family:var(--f-mono);font-size:.7rem;color:var(--gray-lt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.sp{flex:1}
#timer{display:flex;align-items:center;gap:.6rem;font-family:var(--f-mono);font-size:.78rem;background:var(--black-soft);border-radius:3px;padding:.3rem .5rem .3rem .8rem}
#timer .t{color:var(--lime);font-weight:500;min-width:62px}
#timer .blk{color:var(--gray-lt);font-size:.64rem;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
#timer.over .t{color:var(--red-lt)}
.nb{background:transparent;color:var(--white);border:1px solid rgba(255,255,255,.3);border-radius:3px;font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;padding:.4rem .65rem;text-decoration:none;white-space:nowrap}
.nb:hover{background:var(--red);border-color:var(--red)}
.nb.lime{background:var(--lime);color:var(--black);border-color:var(--lime);font-weight:700}
.nb.lime:hover{background:var(--lime-dk)}
#save{font-family:var(--f-mono);font-size:.62rem;color:var(--gray-lt);white-space:nowrap}
#ovBar{position:fixed;top:56px;left:0;height:3px;background:var(--lime);z-index:99;width:0;transition:width .4s}

/* LAYOUT */
#app{display:grid;grid-template-columns:260px 1fr;margin-top:59px;min-height:calc(100vh - 59px)}
#side{background:var(--black);color:var(--white);padding:1.2rem .8rem;position:sticky;top:59px;height:calc(100vh - 59px);overflow-y:auto}
#side h2{font-family:var(--f-mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gray-lt);margin:.8rem .5rem .4rem}
.st{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;background:transparent;border:0;border-left:3px solid transparent;color:rgba(255,255,255,.8);padding:.6rem .6rem;border-radius:0 3px 3px 0;font-size:.82rem;font-family:var(--f-disp);font-weight:600}
.st:hover{background:rgba(255,255,255,.06)}
.st.on{background:var(--red);border-left-color:var(--lime);color:var(--white)}
.st .n{font-family:var(--f-mono);font-size:.62rem;width:22px;height:22px;border-radius:3px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.st.done .n{background:var(--lime);color:var(--black)}
.st .pg{margin-left:auto;font-family:var(--f-mono);font-size:.58rem;color:var(--gray-lt)}
.st.on .pg{color:rgba(255,255,255,.8)}
#main{padding:2rem 2.5rem 5rem;max-width:980px;width:100%}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--f-mono);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:.4rem}
.eyebrow::before{content:'';width:16px;height:2px;background:var(--red)}
h1.ttl{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.7rem,3.4vw,2.5rem);line-height:1;letter-spacing:-1px;margin-bottom:.6rem}
.lead{font-size:.95rem;max-width:680px;opacity:.85;margin-bottom:1.6rem}
.card{background:var(--white);border:1px solid var(--bone-dk);border-left:4px solid var(--red);border-radius:4px;padding:1.3rem;margin-bottom:1.1rem}
.card h3,.card h2{font-family:var(--f-disp);font-size:1.02rem;margin-bottom:.5rem}
.card p,.card li{font-size:.88rem}
.card ul{margin-left:1.1rem}
.dark{background:var(--black);color:var(--white);border-left-color:var(--lime)}
.dark h3{color:var(--lime)}
.callout{background:#EEFFC2;border:1px solid var(--lime-dk);border-radius:4px;padding:.9rem 1.1rem;font-size:.85rem;margin-bottom:1.1rem}
.callout b.k{display:block;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:.2rem}
.callout.warn{background:rgba(232,0,28,.08);border-color:rgba(232,0,28,.45)}
.quote{border-left:4px solid var(--red);background:var(--white);padding:1rem 1.2rem;font-style:italic;margin-bottom:1.1rem;font-size:.92rem}
.quote cite{display:block;font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--gray);margin-top:.4rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:.8rem}
.stat{background:var(--black);color:var(--white);border-radius:4px;padding:1rem}
.stat b{display:block;font-family:var(--f-disp);font-size:1.7rem;color:var(--lime);line-height:1}
.stat span{font-size:.75rem;opacity:.8;display:block;margin-top:.3rem;line-height:1.35}

/* FIELDS */
.fld{margin-bottom:1.2rem}
.fld>label{display:flex;gap:.6rem;flex-wrap:wrap;align-items:baseline;font-family:var(--f-disp);font-weight:700;font-size:.9rem;margin-bottom:.35rem;line-height:1.3}
.crit{font-family:var(--f-mono);font-weight:400;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;background:var(--black);color:var(--lime);padding:.15rem .45rem;border-radius:2px}
.inp,select.inp{font:inherit;font-size:.88rem;width:100%;padding:.65rem .75rem;background:var(--white);border:1.5px solid var(--bone-dk);border-radius:3px;color:var(--black);line-height:1.5}
textarea.inp{resize:vertical;min-height:90px}
.inp:focus{border-color:var(--red);outline:2px solid rgba(232,0,28,.2)}
.meter{font-family:var(--f-mono);font-size:.62rem;color:var(--gray);margin-top:.25rem;display:flex;justify-content:space-between}
.meter.ok{color:var(--ok)}
details.hint{margin-bottom:.4rem}
details.hint summary{font-family:var(--f-mono);font-size:.62rem;color:var(--red);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
details.hint p{font-size:.8rem;background:var(--white);border:1px dashed var(--red);padding:.6rem .8rem;margin-top:.3rem;border-radius:3px}
.row{display:grid;gap:.6rem;align-items:start}
.item{background:var(--white);border:1px solid var(--bone-dk);border-radius:4px;padding:.9rem;margin-bottom:.7rem;position:relative}
.item .hd{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem;font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--red)}
.item .hd .sp{flex:1}
.ib{background:transparent;border:1px solid var(--bone-dk);border-radius:2px;width:26px;height:26px;font-size:.8rem;line-height:1;color:var(--black)}
.ib:hover{background:var(--black);color:var(--lime)}
.ib.del:hover{background:var(--red);color:#fff}
.add{background:var(--black);color:var(--lime);border:0;border-radius:3px;padding:.55rem 1rem;font-family:var(--f-disp);font-weight:700;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}
.add:hover{background:var(--red);color:#fff}
.btn{display:inline-block;font-family:var(--f-disp);font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase;padding:.7rem 1.2rem;border-radius:3px;border:2px solid var(--black);background:var(--black);color:var(--lime);text-decoration:none}
.btn:hover{background:var(--red);border-color:var(--red);color:#fff}
.btn.sec{background:transparent;color:var(--black)}
.btn.sec:hover{background:var(--black);color:var(--lime);border-color:var(--black)}
.btn.lime{background:var(--lime);border-color:var(--lime);color:var(--black)}
.nav-btns{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.mchips{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem;margin-bottom:1.2rem}
.mc{background:var(--white);border:2px solid var(--bone-dk);border-radius:4px;padding:.9rem;text-align:left;color:var(--black)}
.mc b{font-family:var(--f-disp);display:block;margin-bottom:.2rem}
.mc span{font-size:.74rem;line-height:1.4;display:block;color:var(--gray)}
.mc[aria-pressed=true]{background:var(--black);border-color:var(--lime);color:var(--white)}
.mc[aria-pressed=true] span{color:rgba(255,255,255,.75)}
.badge{display:inline-block;font-family:var(--f-mono);font-size:.58rem;padding:.12rem .4rem;border-radius:2px;margin-right:.3rem;text-transform:uppercase;letter-spacing:.04em}
.badge.y{background:rgba(0,201,112,.18);color:var(--ok)}.badge.n{background:rgba(232,0,28,.12);color:var(--red-dk)}

/* FLOW VISUALS */
.fv{margin:1rem 0 1.4rem}
.fv .lbl{font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--red);margin-bottom:.4rem}
.spr{display:flex;gap:4px;min-height:96px}
.sp1{background:var(--black);color:var(--white);border-top:3px solid var(--red);border-radius:3px;padding:.6rem .7rem;font-size:.74rem;line-height:1.35;overflow:hidden}
.sp1 b{font-family:var(--f-disp);color:var(--lime);display:block;font-size:.82rem}
.sp1 small{font-family:var(--f-mono);font-size:.58rem;color:var(--gray-lt)}
.scale{display:flex;font-family:var(--f-mono);font-size:.58rem;color:var(--gray);margin-top:.2rem;justify-content:space-between}
.kb{display:flex;gap:6px;overflow-x:auto;padding-bottom:.3rem}
.kc{flex:1 0 118px;background:var(--black-soft);border-radius:3px;border-top:3px solid var(--red);color:var(--white);padding:.6rem;min-height:110px}
.kc b{font-family:var(--f-disp);font-size:.78rem;display:block;line-height:1.2}
.kc .w{display:inline-block;margin-top:.4rem;font-family:var(--f-mono);font-size:.6rem;background:var(--lime);color:var(--black);padding:.1rem .4rem;border-radius:2px;font-weight:700}
.kc .w.x{background:var(--red);color:#fff}
.kc i{display:block;height:14px;margin-top:.35rem;background:rgba(255,255,255,.1);border-radius:2px}
.dsd{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.dsd .sp1{border-top-color:var(--lime)}
.ln{display:flex;flex-direction:column;gap:6px}
.lnr{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.lnr .sp1:nth-child(1){border-top-color:var(--red)}.lnr .sp1:nth-child(2){border-top-color:var(--lime)}.lnr .sp1:nth-child(3){border-top-color:#fff}
.empty{font-style:italic;font-size:.85rem;color:var(--gray)}

/* revision */
.semaforo{display:grid;gap:.8rem}
.sem-row{background:var(--white);border:1px solid var(--bone-dk);border-radius:4px;padding:1rem}
.sem-row .h{display:flex;justify-content:space-between;font-family:var(--f-disp);font-weight:700;font-size:.9rem;margin-bottom:.4rem;gap:.8rem}
.sem-row .h span{font-family:var(--f-mono);font-size:.7rem;color:var(--red)}
.bar{height:10px;background:var(--bone-dk);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
.bar.g i{background:var(--ok)}
.chk label{display:flex;gap:.7rem;align-items:flex-start;background:var(--white);border:1.5px solid var(--bone-dk);border-radius:3px;padding:.75rem .9rem;margin-bottom:.5rem;font-size:.87rem;cursor:pointer}
.chk input{margin-top:.2rem;width:18px;height:18px;accent-color:var(--red)}
.chk label:has(input:checked){border-color:var(--ok);background:rgba(0,201,112,.08)}

/* rehearsal */
.rh{background:var(--black);color:var(--white);border-radius:4px;padding:1.2rem;display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap;margin-bottom:1.1rem}
.rh .t{font-family:var(--f-disp);font-weight:800;font-size:2.4rem;color:var(--lime);min-width:110px}
.rh .t.warn{color:#FFB800}.rh .t.bad{color:var(--red-lt)}
.rh .m{font-family:var(--f-mono);font-size:.72rem;color:var(--gray-lt);flex:1;min-width:180px}

/* overlays */
.ov{position:fixed;inset:0;z-index:300;background:rgba(15,15,15,.75);display:none}
.ov.open{display:block}
.drawer{position:absolute;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bone);overflow-y:auto;padding:1.5rem;border-left:4px solid var(--lime)}
.drawer .x{float:right}
#proj{background:var(--black);z-index:400}
#proj .slide{position:absolute;inset:0;padding:5vh 6vw;color:var(--white);display:none;flex-direction:column;justify-content:center;overflow:auto}
#proj .slide.on{display:flex}
#proj .slide.red{background:var(--red)}
#proj h2{font-family:var(--f-disp);font-weight:800;font-size:clamp(1.8rem,4.2vw,3.4rem);line-height:1;letter-spacing:-1px;margin-bottom:1.2rem}
#proj .k{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);margin-bottom:.6rem}
#proj .big{font-family:var(--f-disp);font-size:clamp(1.3rem,2.8vw,2.3rem);font-weight:700;line-height:1.2;max-width:1000px}
#proj p,#proj li{font-size:clamp(.95rem,1.8vw,1.35rem);line-height:1.5;max-width:1000px}
#proj ul{margin-left:1.3rem}
#proj .sp1,#proj .kc{font-size:clamp(.7rem,1.2vw,.95rem)}
#proj .sp1 b{font-size:clamp(.8rem,1.4vw,1.1rem)}
#proj .kc b{font-size:clamp(.75rem,1.3vw,1rem)}
#projUI{position:absolute;bottom:1rem;left:0;right:0;display:flex;justify-content:center;gap:.6rem;z-index:5;align-items:center}
#projUI .c{font-family:var(--f-mono);font-size:.7rem;color:var(--gray-lt)}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem}
.tbl th{background:var(--black);color:var(--lime);font-family:var(--f-mono);font-size:.62rem;text-transform:uppercase;text-align:left;padding:.6rem}
.tbl td{padding:.6rem;border-bottom:1px solid var(--bone-dk);vertical-align:top}
#proj .tbl td{border-color:rgba(255,255,255,.2)}
#proj .fv .lbl{color:var(--lime)}
#proj .empty{color:var(--gray-lt)}

/* docente */
.doc-wrap{display:grid;grid-template-columns:260px 1fr;gap:1.2rem}
.gl button{display:block;width:100%;text-align:left;background:var(--white);border:1.5px solid var(--bone-dk);border-radius:3px;padding:.6rem .8rem;margin-bottom:.4rem;font-family:var(--f-disp);font-weight:700;font-size:.85rem}
.gl button.on{border-color:var(--red);background:var(--black);color:var(--lime)}
.gl small{font-family:var(--f-mono);font-weight:400;font-size:.58rem;display:block;opacity:.75}
.rub{background:var(--white);border:1px solid var(--bone-dk);border-radius:4px;padding:1rem;margin-bottom:.8rem}
.rub .h{display:flex;justify-content:space-between;font-family:var(--f-disp);font-weight:700;gap:.8rem}
.rub .h span{font-family:var(--f-mono);font-size:.7rem;color:var(--red)}
.rub input[type=range]{width:100%;accent-color:var(--red);margin:.4rem 0}
.gradebox{background:var(--black);color:var(--white);padding:1.2rem;border-radius:4px;text-align:center}
.gradebox b{font-family:var(--f-disp);font-size:3rem;color:var(--lime);display:block;line-height:1}

#printArea{display:none}
.pre{white-space:pre-wrap;margin-bottom:.4rem;font-size:.88rem}
#docSummary h1{font-family:var(--f-disp);font-size:1.4rem;margin-bottom:.3rem}
#docSummary h2{font-family:var(--f-disp);font-size:1.05rem;color:var(--red-dk);margin:1.1rem 0 .3rem}
#docSummary h3{font-family:var(--f-mono);font-size:.64rem;text-transform:uppercase;letter-spacing:.08em;margin:.6rem 0 .15rem}
#docSummary table{width:100%;border-collapse:collapse;font-size:.84rem;margin:.3rem 0}
#docSummary th,#docSummary td{border:1px solid var(--bone-dk);padding:.4rem .5rem;text-align:left;vertical-align:top}
#docSummary th{background:var(--black);color:var(--lime);font-family:var(--f-mono);font-size:.6rem;text-transform:uppercase}
#docSummary .meta{font-size:.75rem;color:var(--gray)}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #side{position:static;height:auto;display:flex;overflow-x:auto;padding:.5rem;gap:.3rem}
  #side h2{display:none}
  .st{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;border-radius:3px}
  .st.on{border-bottom-color:var(--lime)}
  .st .pg{display:none}
  #main{padding:1.4rem 1.1rem 4rem}
  .grid2,.grid4,.mchips,.doc-wrap{grid-template-columns:1fr 1fr}
  .doc-wrap{grid-template-columns:1fr}
  .dsd{grid-template-columns:1fr}
  .grp,#save{display:none}
  #nav{gap:.5rem;padding:0 .7rem}
  .nb.hide-m{display:none}
  #timer .blk{display:none}
}
@media (max-width:560px){.grid2,.grid4,.mchips{grid-template-columns:1fr}}

@media print{
  body{background:#fff}
  #nav,#ovBar,#app,.ov{display:none!important}
  #printArea{display:block;font-family:Georgia,serif;color:#000;font-size:10.5pt;line-height:1.45;padding:0}
  #printArea h1{font-family:Arial,sans-serif;font-size:18pt;border-bottom:3px solid #E8001C;padding-bottom:4pt;margin-bottom:6pt}
  #printArea h2{font-family:Arial,sans-serif;font-size:12pt;margin:12pt 0 4pt;color:#B5001A;page-break-after:avoid}
  #printArea h3{font-family:Arial,sans-serif;font-size:10pt;margin:6pt 0 2pt}
  #printArea table{width:100%;border-collapse:collapse;margin:4pt 0}
  #printArea th,#printArea td{border:1px solid #999;padding:3pt 5pt;font-size:9.5pt;text-align:left;vertical-align:top}
  #printArea th{background:#eee}
  #printArea .pre{white-space:pre-wrap;margin-bottom:4pt}
  #printArea .meta{font-size:9pt;color:#444}
  #printArea .fv{display:none}
}
</style>
</head>
<body>
<div id="ovBar" aria-hidden="true"></div>
<header id="nav">
  <div class="logo">ZEGEL<span>.</span></div>
  <div class="grp" id="navGrp">Evaluación 1 · A1</div>
  <div class="sp"></div>
  <div id="timer" role="timer" aria-label="Cronómetro de la sesión"><span class="t" id="tT">00:00</span><span class="blk" id="tB">Bloque 1</span><button class="nb" id="tBtn" type="button">▶ Iniciar</button></div>
  <span id="save" role="status" aria-live="polite">Guardado automático</span>
  <button class="nb hide-m" id="btnCaso" type="button">Ver caso</button>
  <a class="nb hide-m" href="landing_semana5_repaso_evaluacion1.html" target="_blank" rel="noopener">Repaso ↗</a>
  <button class="nb lime" id="btnProj" type="button">Proyectar</button>
</header>

<div id="app">
  <nav id="side" aria-label="Pasos de la evaluación"></nav>
  <main id="main" tabindex="-1"></main>
</div>

<div class="ov" id="ovCaso" role="dialog" aria-modal="true" aria-label="Caso Tela Peruana"><div class="drawer"><button class="nb x" style="color:var(--black);border-color:var(--black)" type="button" data-act="closeCaso">Cerrar ✕</button><div id="casoBox"></div></div></div>
<div class="ov" id="proj" role="dialog" aria-modal="true" aria-label="Vista de proyección"><div id="projSlides"></div><div id="projUI"><button class="nb" type="button" data-act="projPrev">← Anterior</button><span class="c" id="projC"></span><button class="nb" type="button" data-act="projNext">Siguiente →</button><button class="nb" type="button" data-act="projClose">Salir (Esc)</button></div></div>
<div id="printArea"></div>

<script>
'use strict';
/* ═══════════ utilidades ═══════════ */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wc=s=>{s=(s||'').trim();return s?s.split(/\s+/).length:0};

function merge(base,src){ // mezcla estructura por defecto con lo guardado (tolera versiones)
  if(Array.isArray(base))return Array.isArray(src)?src:base;
  if(base&&typeof base==='object'){if(!Object.keys(base).length)return(src&&typeof src==='object')?src:base;const o={};for(const k in base)o[k]=merge(base[k],src&&src[k]);return o}
  return src===undefined||src===null?base:src;
}

function metricCheck(t){
  t=t||'';
  return{num:/\d/.test(t),plazo:/(\d+\s*(d[ií]as?|semanas?|meses?|sprints?|a[nñ]os?|trimestres?))|trimestre|semestre|lima fashion|30 d/i.test(t),base:/(\bdel?\s+[\d.,]+\s*(%|semanas?|d[ií]as?|horas?|\w+)?\s*(a|al|hasta)\s+(el\s+)?[\d.,]+)|l[ií]nea base|actual(mente)?|desde\s+\d|pasar de|reducir de|aumentar de|respecto a|frente a|baseline|vs\.?\s/i.test(t)};
}
const metricOk=t=>{const c=metricCheck(t);return c.num&&c.plazo&&c.base};

function flujoProg(st){
  const b=st.b1.metodo,f=st.b2;let d=0,t=0;
  t+=1;d+=wc(f.cambio)>=12?1:0;
  if(!b)return{d:0,t:2};
  if(b==='scrum'){const s=f.scrum.sprints,wk=s.reduce((a,x)=>a+(+x.sem||0),0);t+=5;d+=f.scrum.po.trim()?1:0;d+=Math.min(s.filter(x=>x.goal.trim()&&x.ent.trim()).length,2);d+=(wk>0&&wk<=10)?1:0;d+=wc(f.scrum.cer)>=6?1:0}
  else if(b==='kanban'){const c=f.kanban.cols;t+=5;d+=Math.min(c.filter(x=>x.n.trim()&&+x.w>0).length,4);d+=wc(f.kanban.pol)>=6?1:0}
  else if(b==='ds'){const dd=f.ds.dias;t+=6;d+=dd.filter(x=>x.par.trim()&&x.obj.trim()&&x.out.trim()).length;d+=f.ds.decision.trim()?1:0}
  else{const c=f.lean.ciclos;t+=2;d+=c.filter(x=>x.h.trim()&&x.b.trim()&&x.m.trim()&&x.l.trim()).length?2:0}
  return{d,t};
}
function progress(id,st){
  const b1=st.b1,b2=st.b2,b3=st.b3;
  switch(id){
   case'equipo':{const ok=st.team.filter(m=>m.n.trim()&&m.r);const rs=ok.map(m=>m.r);const req=['PO','AC','UX','CB'].filter(r=>rs.includes(r)).length;return{d:(st.meta.grupo.trim()?1:0)+Math.min(ok.length,4)+req+(new Set(rs).size===rs.length?1:0),t:10}}
   case'caso':return{d:st.visited.caso?1:0,t:1};
   case'diag':return{d:(wc(b1.problema)>=6?1:0)+['q1','q2','q3','q4'].filter(k=>wc(b1[k])>=15).length,t:5};
   case'metodo':return{d:(b1.metodo?1:0)+(b1.descartada?1:0)+(wc(b1.porque)>=25?1:0)+(wc(b1.riesgo)>=8?1:0),t:4};
   case'flujo':return flujoProg(st);
   case'artef':return{d:Math.min(b2.backlog.filter(x=>x.t.trim()).length,6)+Object.values(b2.roles).filter(x=>x.trim()).length+Math.min(b2.metricas.filter(x=>metricOk(x.t)).length,3),t:13};
   case'plan':return{d:Math.min(b2.plan.filter(x=>x.a.trim()&&x.r.trim()&&x.p.trim()).length,6),t:6};
   case'expo':return{d:['prob','sol','met','obst'].filter(k=>wc(b3[k])>=8).length+(b3.ensayoSeg>=300&&b3.ensayoSeg<=420?1:0),t:5};
   case'rev':return{d:st.rev.c.filter(Boolean).length,t:3};
   default:return{d:0,t:0};
  }
}
function criterios(st){
  const P=id=>progress(id,st);
  const r=(...ids)=>{let d=0,t=0;ids.forEach(i=>{const p=P(i);d+=p.d;t+=p.t});return t?d/t:0};
  const eq=P('equipo'),ex=P('expo'),rv=P('rev');
  return[
    ['Coherencia del diagnóstico',30,r('diag')],
    ['Selección y justificación de metodología',30,r('metodo')],
    ['Calidad de la propuesta de implementación',25,r('flujo','artef','plan')],
    ['Exposición y trabajo colaborativo',15,(ex.d+rv.d+eq.d)/(ex.t+rv.t+eq.t)]
  ];
}
function overall(st){let d=0,t=0;STEPS.forEach(s=>{if(s.id==='entrega')return;const p=progress(s.id,st);d+=p.d;t+=p.t});return t?d/t:0}

const elapsed=()=>S.timer.acc+(S.timer.startedAt?Date.now()-S.timer.startedAt:0);
const mmss=ms=>{const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function tick(){
  const total=S.meta.dur*60000,per=total/3,e=elapsed();
  const b=Math.min(2,Math.floor(e/per)),left=per*(b+1)-e;
  $('#tT').textContent=mmss(e);
  $('#tB').textContent=e>=total?'Tiempo total cumplido':'Bloque '+(b+1)+' · quedan '+mmss(left);
  $('#timer').classList.toggle('over',e>=total||left<5*60000);
  $('#tBtn').textContent=S.timer.startedAt?'⏸ Pausar':(e>0?'▶ Reanudar':'▶ Iniciar');
}
$('#tBtn').onclick=()=>{
  if(S.timer.startedAt){S.timer.acc+=Date.now()-S.timer.startedAt;S.timer.startedAt=null}else S.timer.startedAt=Date.now();
  save();tick();
};

  fld('b1.problema','Paso 1 · Problema central identificado por el grupo (una oración)',{rows:2,crit:'Criterio 1 · 30%',min:6,hint:'Una sola oración potente. Si necesitan dos, aún no tienen claro el problema. Que describa el sistema, no a las personas.'})+
  fld('b1.q1','Pregunta 1 · ¿Cuál es el mayor cuello de botella en el proceso creativo? ¿En qué punto del flujo se pierde más tiempo o se generan más reprocesos?',{rows:5,min:15,crit:'Criterio 1',hint:'Busquen la causa detrás de la causa: pregúntense "¿por qué?" varias veces. Citen datos del caso.'})+
  fld('b1.q2','Pregunta 2 · ¿Qué valor del Manifiesto Ágil está siendo violado sistemáticamente? Justifiquen con evidencia del caso.',{rows:5,min:15,crit:'Criterio 1',hint:'Nombren el valor (clásico y su adaptación) y expliquen por qué una evidencia concreta lo demuestra. Pueden usar uno principal y uno secundario.'})+
  fld('b1.q3','Pregunta 3 · ¿Qué impacto tiene la falta de agilidad en el negocio? Cuantifiquen usando los datos del caso.',{rows:5,min:15,crit:'Criterio 1',hint:'Comparen cifras reales del caso con el estándar del sector y calculen diferencias o porcentajes. Incluyan demanda no capturada.'})+
  fld('b1.q4','Pregunta 4 · ¿Cuáles son los dos principales obstáculos humanos o culturales que una metodología ágil enfrentaría en este equipo?',{rows:5,min:15,crit:'Criterio 1',hint:'Piensen en personas y áreas concretas, no en "resistencia al cambio" en abstracto. Anticipen una estrategia para cada obstáculo.'})+navBtns(i);
},
metodo(i){
  const b=S.b1.metodo;
  const desc=Object.entries(METODOS).filter(([k])=>k!==b).map(([k,v])=>[k,v[0]]);
  return head(i,'Bloque 1 · Paso 3','Selección de metodología','Elijan una metodología principal y justifiquen la elección comparándola con al menos otra que descartaron. La justificación debe ser crítica, no descriptiva.')+
  `<div class="mchips" role="group" aria-label="Metodología elegida">${Object.entries(METODOS).map(([k,v])=>`<button type="button" class="mc" data-act="setMetodo" data-v="${k}" aria-pressed="${b===k}"><b>${v[0]}</b><span>${v[1]}</span></button>`).join('')}</div>`+
  `<div class="fld"><label for="desc">Metodología descartada que compararon<span class="crit">Criterio 2 · 30%</span></label><select id="desc" class="inp" data-k="b1.descartada" ${b?'':'disabled'}><option value="">— elige —</option>${desc.map(([k,n])=>`<option value="${k}" ${S.b1.descartada===k?'selected':''}>${n}</option>`).join('')}</select></div>`+
  fld('b1.porque','¿Por qué esta metodología y no las otras? (compare con al menos una alternativa)',{rows:7,min:25,crit:'Criterio 2 · 30%',hint:'Fórmula: contexto del caso → criterio → elección → alternativa descartada y por qué → riesgo. Ej.: "Dado que hay una fecha fija en 10 semanas y el equipo no tiene experiencia, necesitamos…". Evita describir la metodología sin conectarla con Tela Peruana.'})+
  fld('b1.riesgo','Riesgo principal de su elección y cómo lo mitigan',{rows:3,min:8,crit:'Pensamiento crítico',hint:'Toda elección tiene un costo. Nombrarlo y mitigarlo demuestra criterio.'})+
  `<div class="callout"><b class="k">Recordatorio</b>Dos grupos pueden elegir metodologías distintas y ambos sacar sobresaliente. Se evalúa la justificación, no la "respuesta correcta". Pueden complementar con prácticas de otra metodología siempre que aclaren cuál es la principal.</div>`+navBtns(i);
},
flujo(i){
  const b=S.b1.metodo,f=S.b2;let body='';
  if(!b)body='<div class="callout warn"><b class="k">Primero elijan</b>El constructor de flujo se adapta a la metodología seleccionada. <button class="btn sec" type="button" data-go="metodo" style="margin-top:.5rem">Ir a Metodología</button></div>';
  else if(b==='scrum'){
    const sp=f.scrum.sprints,wk=sp.reduce((a,x)=>a+(+x.sem||0),0);
    body=`<div class="callout"><b class="k">Si eligieron Scrum</b>Definan al menos 2 sprints mínimos viables para lanzar la colección cápsula en 10 semanas. ¿Qué se entrega al final de cada sprint? ¿Quién es el Product Owner en Tela Peruana?</div>`+
    fld('b2.scrum.po','Product Owner de Tela Peruana (persona y por qué)',{rows:2,min:6,hint:'El PO necesita autoridad para decidir prioridades y disponibilidad. Piensa en las 18 personas del equipo.'})+
    sp.map((s,k)=>`<div class="item"><div class="hd"><span>Sprint ${k+1}</span>${ctl('',  'b2.scrum.sprints',k,sp.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><div class="row" style="grid-template-columns:2fr 1fr"><input class="inp" aria-label="Nombre del sprint" data-k="b2.scrum.sprints.${k}.n" value="${esc(s.n)}"><input class="inp" type="number" min="1" max="4" aria-label="Duración en semanas" data-k="b2.scrum.sprints.${k}.sem" data-num="1" data-re="1" value="${s.sem}"></div><div class="row" style="grid-template-columns:1fr 1fr;margin-top:.5rem"><textarea class="inp" rows="3" aria-label="Sprint Goal" placeholder="Sprint Goal (un objetivo comprensible)" data-k="b2.scrum.sprints.${k}.goal">${esc(s.goal)}</textarea><textarea class="inp" rows="3" aria-label="Entregable" placeholder="¿Qué se entrega al final del sprint?" data-k="b2.scrum.sprints.${k}.ent">${esc(s.ent)}</textarea></div></div>`).join('')+
    `<button class="add" type="button" data-act="add" data-list="b2.scrum.sprints">+ Agregar sprint</button><p class="mono" style="font-size:.66rem;margin:.6rem 0 1rem">Total: ${wk} semanas ${wk>10?'· ⚠ excede las 10 semanas disponibles':wk>0?'· dentro de las 10 semanas':''}</p>`+
    fld('b2.scrum.cer','¿Cómo adaptan las ceremonias (Planning, Daily, Review, Retro) a un equipo creativo de 18 personas?',{rows:3,min:6,hint:'Duración, quiénes asisten, qué se muestra en la Review, cómo se facilitan sin un Scrum Master de tiempo completo.'});
  }else if(b==='kanban'){
    const c=f.kanban.cols;
    body=`<div class="callout"><b class="k">Si eligieron Kanban</b>Dibujen el tablero completo con columnas adaptadas al proceso creativo y definan el <b>límite WIP</b> de cada columna. Las columnas precargadas son el ejemplo del enunciado: adáptenlas.</div>`+
    c.map((x,k)=>`<div class="item"><div class="hd"><span>Columna ${k+1}</span>${ctl('','b2.kanban.cols',k,c.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><div class="row" style="grid-template-columns:2fr 1fr"><input class="inp" aria-label="Nombre columna" data-k="b2.kanban.cols.${k}.n" value="${esc(x.n)}"><input class="inp" type="number" min="1" max="20" placeholder="Límite WIP" aria-label="Límite WIP" data-k="b2.kanban.cols.${k}.w" data-re="1" value="${esc(x.w)}"></div></div>`).join('')+
    `<button class="add" type="button" data-act="add" data-list="b2.kanban.cols">+ Agregar columna</button><div style="height:1rem"></div>`+
    fld('b2.kanban.pol','Políticas del tablero (¿cuándo una tarjeta pasa a la siguiente columna? ¿qué pasa si se llena el WIP?)',{rows:3,min:6,hint:'Una columna llena no es un problema a esconder: es una señal. Definan qué hacen cuando ocurre.'});
  }else if(b==='ds'){
    body=`<div class="callout"><b class="k">Si eligieron Design Sprint</b>Mapeen los 5 días adaptados al reto de la colección cápsula. ¿Quiénes participan cada día? ¿Qué decisión toman el viernes?</div>`+
    f.ds.dias.map((d,k)=>`<div class="item"><div class="hd"><span>${esc(d.n)}</span></div><div class="row" style="grid-template-columns:1fr 1fr 1fr"><textarea class="inp" rows="3" aria-label="Participantes" placeholder="¿Quiénes participan?" data-k="b2.ds.dias.${k}.par">${esc(d.par)}</textarea><textarea class="inp" rows="3" aria-label="Objetivo del día" placeholder="Objetivo adaptado a la colección cápsula" data-k="b2.ds.dias.${k}.obj">${esc(d.obj)}</textarea><textarea class="inp" rows="3" aria-label="Resultado del día" placeholder="Qué se obtiene al final del día" data-k="b2.ds.dias.${k}.out">${esc(d.out)}</textarea></div></div>`).join('')+
    fld('b2.ds.decision','Decisión que se toma el viernes',{rows:2,hint:'Debe ser una decisión de negocio verificable con lo aprendido en el test.'});
  }else{
    const c=f.lean.ciclos;
    body=`<div class="callout"><b class="k">Si eligieron Lean UX</b>Definan el ciclo Build–Measure–Learn para el primer experimento. ¿Qué hipótesis están probando? ¿Cómo miden si funciona?</div>`+
    c.map((x,k)=>`<div class="item"><div class="hd"><span>Ciclo ${k+1}</span>${ctl('','b2.lean.ciclos',k,c.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><textarea class="inp" rows="2" aria-label="Hipótesis" placeholder="Hipótesis: creemos que… lo que provocará… lo sabremos cuando…" data-k="b2.lean.ciclos.${k}.h">${esc(x.h)}</textarea><div class="row" style="grid-template-columns:1fr 1fr 1fr;margin-top:.5rem"><textarea class="inp" rows="3" aria-label="Build" placeholder="Build: ¿qué construimos?" data-k="b2.lean.ciclos.${k}.b">${esc(x.b)}</textarea><textarea class="inp" rows="3" aria-label="Measure" placeholder="Measure: ¿cómo medimos?" data-k="b2.lean.ciclos.${k}.m">${esc(x.m)}</textarea><textarea class="inp" rows="3" aria-label="Learn" placeholder="Learn: ¿qué decidimos según el resultado?" data-k="b2.lean.ciclos.${k}.l">${esc(x.l)}</textarea></div></div>`).join('')+
    `<button class="add" type="button" data-act="add" data-list="b2.lean.ciclos">+ Agregar ciclo</button>`;
  }
  return head(i,'Bloque 2 · Diseño de la solución','Flujo de trabajo ágil','El flujo debe mostrar claramente cómo cambiaría el proceso actual de 22 semanas. Dibujen en la pizarra o construyan aquí su versión digital.')+
  `<div class="card">${body}</div>`+
  `<div class="card"><h3>Vista previa del flujo</h3><div id="flowPrev">${flowVisual(S)}</div></div>`+
  fld('b2.cambio','¿Cómo cambia el proceso actual de 22 semanas con su propuesta? (antes → después)',{rows:4,min:12,crit:'Criterio 3 · 25%',hint:'Compara el proceso lineal actual con el nuevo ritmo: cuándo ve cosas concretas cada área, cada cuánto hay feedback, cuántas semanas esperan para el primer entregable.'})+
  fld('b2.flujoDesc','Notas adicionales o descripción de lo dibujado en pizarra (opcional)',{rows:3})+navBtns(i);
},
artef(i){
  const bl=S.b2.backlog,mt=S.b2.metricas;
  return head(i,'Bloque 2 · Paso 2','Artefactos clave','Rodrigo Valdés no tiene paciencia para generalidades: necesita saber exactamente qué va a cambiar y cómo.')+
  `<h2 style="font-family:var(--f-disp);margin-bottom:.4rem">Backlog inicial <span class="crit">≥ 6 ítems · prioricen: el primero es el más urgente</span></h2><p class="lead" style="margin-bottom:.8rem">Escriban resultados, no tareas. Usen tallas de camiseta (XS–XL) y dividan todo lo que sea XL. Reordenen con ↑ ↓.</p>`+
  bl.map((b,k)=>`<div class="item"><div class="hd"><span>Prioridad ${k+1}</span>${ctl('','b2.backlog',k,bl.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><div class="row" style="grid-template-columns:3fr 90px"><textarea class="inp" rows="2" aria-label="Ítem de backlog ${k+1}" placeholder="Resultado concreto para la colección cápsula" data-k="b2.backlog.${k}.t">${esc(b.t)}</textarea>${sel('b2.backlog.'+k+'.s',SIZES.map(s=>[s,s]),{al:'Talla'})}</div><input class="inp" style="margin-top:.5rem" aria-label="Por qué va en esta posición" placeholder="¿Por qué en esta posición? (valor, urgencia, dependencia o riesgo)" data-k="b2.backlog.${k}.why" value="${esc(b.why)}"></div>`).join('')+
  `<button class="add" type="button" data-act="add" data-list="b2.backlog">+ Agregar ítem</button>`+
  `<datalist id="dlRoles"><option value="Rodrigo Valdés (Gerente General)"><option value="Diseñador/a de moda"><option value="Diseñador/a gráfico/a"><option value="Community manager"><option value="Persona de producción"><option value="Persona de ventas"><option value="Persona administrativa"></datalist>`+
  `<h2 style="font-family:var(--f-disp);margin:2rem 0 .4rem">Roles ágiles en el equipo de Tela Peruana</h2><p class="lead" style="margin-bottom:.8rem">¿Quién de las 18 personas asume cada rol y por qué? Piensen en autoridad, disponibilidad y carga de trabajo.</p><div class="card"><div class="grid2">${fld('b2.roles.po','Quién es el Product Owner y por qué',{rows:3,min:0,list:'dlRoles'})}${fld('b2.roles.sm','Quién facilita (Scrum Master / coach del proceso) y por qué',{rows:3})}${fld('b2.roles.eq','Quiénes conforman el equipo que produce',{rows:3})}${fld('b2.roles.st','Stakeholders (quién valida y cuándo)',{rows:3})}</div></div>`+
  `<h2 style="font-family:var(--f-disp);margin:1.5rem 0 .4rem">Métricas de éxito <span class="crit">≥ 3 concretas y medibles</span></h2><p class="lead" style="margin-bottom:.8rem">Cada métrica necesita número, plazo y punto de partida. Ej.: "Reducir el ciclo de 22 a 14 semanas en 6 meses".</p>`+
  mt.map((m,k)=>{const c=metricCheck(m.t);return`<div class="item"><div class="hd"><span>Métrica ${k+1}</span>${ctl('','b2.metricas',k,mt.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><input class="inp" aria-label="Métrica ${k+1}" data-k="b2.metricas.${k}.t" data-met="1" value="${esc(m.t)}" placeholder="Escribe una métrica medible"><div style="margin-top:.4rem" data-metfor="${k}"><span class="badge ${c.num?'y':'n'}">número</span><span class="badge ${c.plazo?'y':'n'}">plazo</span><span class="badge ${c.base?'y':'n'}">punto de partida</span></div></div>`}).join('')+
  `<button class="add" type="button" data-act="add" data-list="b2.metricas">+ Agregar métrica</button>`+navBtns(i);
},
plan(i){
  const pl=S.b2.plan;
  return head(i,'Bloque 2 · Paso 3','Plan de los primeros 30 días','Al menos 6 acciones específicas. Secuencia lógica: alinear y lograr un quick win visible primero; después el primer ciclo completo; al final medir y ajustar.')+
  pl.map((p,k)=>`<div class="item"><div class="hd"><span>Acción ${k+1}</span>${ctl('','b2.plan',k,pl.length).replace('<div class="hd">','').replace(/<\/div>$/,'')}</div><div class="row" style="grid-template-columns:150px 1fr"><select class="inp" aria-label="Semana" data-k="b2.plan.${k}.s">${['Semana 1','Semana 2','Semana 3','Semana 4','Semana 3–4'].map(s=>`<option ${p.s===s?'selected':''}>${s}</option>`).join('')}</select><textarea class="inp" rows="2" aria-label="Acción específica" placeholder="Acción específica" data-k="b2.plan.${k}.a">${esc(p.a)}</textarea></div><div class="row" style="grid-template-columns:1fr 1fr;margin-top:.5rem"><input class="inp" aria-label="Resultado esperado" placeholder="Resultado esperado (observable)" data-k="b2.plan.${k}.r" value="${esc(p.r)}"><input class="inp" aria-label="Responsable" placeholder="Responsable (persona o rol)" data-k="b2.plan.${k}.p" value="${esc(p.p)}"></div></div>`).join('')+
  `<button class="add" type="button" data-act="add" data-list="b2.plan">+ Agregar acción</button>`+navBtns(i);
},
expo(i){
  return head(i,'Bloque 3 · Presentación y reflexión','Preparación de la exposición','5 a 7 minutos estrictos. Estructura obligatoria: Problema (1 min) → Solución ágil (3–4 min) → Métricas y obstáculos (1–2 min). Después, una pregunta crítica del evaluador.')+
  `<div class="rh"><div class="t" id="rhT">00:00</div><div class="m" id="rhM">Ensayo cronometrado. Meta: entre 05:00 y 07:00.</div><button class="btn lime" type="button" data-act="rh">▶ Iniciar ensayo</button></div>`+
  (S.b3.ensayoSeg?`<p class="mono" style="font-size:.68rem;margin:-.5rem 0 1rem">Último ensayo: ${mmss(S.b3.ensayoSeg*1000)} ${S.b3.ensayoSeg>=300&&S.b3.ensayoSeg<=420?'✓ dentro de rango':'· fuera del rango 5–7 min'}</p>`:'')+
  `<div class="card"><div style="display:flex;gap:.5rem;justify-content:space-between;align-items:center;flex-wrap:wrap"><h3>1 · Problema (1 min)</h3><button class="add" type="button" data-act="traerProb">Traer de Diagnóstico</button></div>${fld('b3.prob','Una sola oración potente',{rows:2,min:8})}</div>`+
  `<div class="card"><h3>2 · Solución ágil (3–4 min)</h3>${fld('b3.sol','¿Qué metodología eligieron, por qué y cómo la adaptaron? Guion: muestren el flujo visual',{rows:5,min:8})}</div>`+
  `<div class="card"><h3>3 · Métricas y obstáculos (1–2 min)</h3>${fld('b3.met','Beneficios esperados y en qué plazo',{rows:3,min:8})}${fld('b3.obst','Obstáculos que anticipan y cómo los enfrentan',{rows:3,min:8})}</div>`+
  `<div class="card dark"><h3>Pregunta crítica: ensáyenla antes de que la haga el evaluador</h3><p id="pregTxt" style="margin-bottom:.8rem;font-size:.95rem">${esc(S.b3.preg||'Pulsa el botón para sortear una pregunta.')}</p><button class="btn lime" type="button" data-act="preg">🎲 Sortear pregunta</button></div>`+
  fld('b3.notas','Notas de preparación para la exposición (quién dice qué, respuestas ensayadas)',{rows:5})+navBtns(i);
},
rev(i){
  const cr=criterios(S);
  return head(i,'Bloque 3 · Paso 3','Revisión final','Antes de presentar, revisen juntos. El semáforo mide completitud de lo escrito, no la calidad: la nota la define la rúbrica del docente.')+
  `<div class="semaforo" style="margin-bottom:1.5rem">${cr.map(c=>`<div class="sem-row"><div class="h"><b>${c[0]}</b><span>${c[1]}% · completitud ${Math.round(c[2]*100)}%</span></div><div class="bar ${c[2]>=.99?'g':''}"><i style="width:${Math.round(c[2]*100)}%"></i></div></div>`).join('')}</div>`+
  `<h2 style="font-family:var(--f-disp);margin-bottom:.6rem">Revisión conjunta del grupo</h2><div class="chk">${['¿Su propuesta es autocontenida? ¿Alguien que no estuvo en la sesión podría entenderla leyendo su hoja de trabajo?','¿Respondieron la pregunta que Rodrigo Valdés les hizo: qué hago el lunes por la mañana?','¿Cada integrante puede explicar cualquier parte de la propuesta, no solo la que diseñó?'].map((t,k)=>`<label><input type="checkbox" data-chk="${k}" ${S.rev.c[k]?'checked':''}><span>${t}</span></label>`).join('')}</div>`+
  `<div class="callout" style="margin-top:1rem"><b class="k">Pendientes detectados</b><ul style="margin-left:1.1rem">${pendientes().map(p=>`<li>${p}</li>`).join('')||'<li>Nada pendiente. ¡Listos para presentar!</li>'}</ul></div>`+navBtns(i);
},
entrega(i){
  return head(i,'Cierre','Entrega y exportación','El entregable es una presentación en pizarra u hoja de trabajo proyectable. Aquí pueden proyectar su propuesta, imprimirla o guardarla.')+
  `<div class="grid2"><div class="card"><h3>Proyectar</h3><p style="margin-bottom:.8rem">Presentación a pantalla completa generada con lo que escribieron: problema, metodología, flujo visual, backlog y roles, métricas y plan.</p><button class="btn lime" type="button" data-act="proj">Abrir proyección</button></div>
  <div class="card"><h3>Imprimir / guardar PDF</h3><p style="margin-bottom:.8rem">Hoja de trabajo completa lista para imprimir. En el diálogo elige "Guardar como PDF".</p><button class="btn" type="button" data-act="print">Imprimir hoja</button></div>
  <div class="card"><h3>Descargas</h3><p style="margin-bottom:.8rem">El archivo .json es la entrega para el docente (puede cargarlo en el modo evaluador). El .md es un texto legible.</p><button class="btn" type="button" data-act="dlJson">Descargar .json</button> <button class="btn sec" type="button" data-act="dlMd">Descargar .md</button></div>
  <div class="card"><h3>Importar / reiniciar</h3><p style="margin-bottom:.8rem">Cargar un .json guardado, o empezar de cero.</p><label class="btn sec" style="cursor:pointer">Importar .json<input type="file" accept=".json,application/json" id="impFile" style="display:none"></label> <button class="btn sec" type="button" data-act="reset" id="resetBtn">Reiniciar todo</button></div></div>`+
  `<div class="callout"><b class="k">Importante</b>Todo se guarda solo en este navegador y este dispositivo. Trabajen desde un solo equipo y descarguen el .json antes de cerrar. <a href="#docente">Modo evaluador (docente)</a></div>`+navBtns(i);
}
};
function pendientes(){
  const p=[];
  STEPS.forEach(s=>{if(['caso','rev','entrega'].includes(s.id))return;const g=progress(s.id,S);if(g.d<g.t)p.push(`<b>${s.t}</b>: ${g.d} de ${g.t} elementos`)});
  return p;
}

/* ═══════════ render ═══════════ */
let cur=lsGet(KEY+'_step','equipo');
function renderSide(){
  $('#side').innerHTML='<h2>Pasos</h2>'+STEPS.map(s=>{const p=progress(s.id,S),dn=p.t&&p.d>=p.t;return`<button type="button" class="st ${s.id===cur?'on':''} ${dn?'done':''}" data-go="${s.id}" ${s.id===cur?'aria-current="step"':''}><span class="n">${dn?'✓':s.n}</span><span>${s.t}</span><span class="pg">${p.t?p.d+'/'+p.t:''}</span></button>`}).join('')+`<h2>Más</h2><button type="button" class="st" data-act="openCaso"><span class="n">?</span><span>Ver el caso</span></button><a class="st" href="#docente" style="text-decoration:none"><span class="n">D</span><span>Modo evaluador</span></a>`;
  const o=overall(S);$('#ovBar').style.width=Math.round(o*100)+'%';
  $('#navGrp').textContent=S.meta.grupo.trim()||'Evaluación 1 · A1';
}
function renderView(keepScroll){
  const i=STEPS.findIndex(s=>s.id===cur);
  const y=window.scrollY;
  $('#main').innerHTML=VIEWS[cur](i);
  updMeters();renderSide();tick();
  if(keepScroll)window.scrollTo(0,y);

  const a=e.target.closest('[data-dact]');if(!a)return;const g=D.groups[D.sel];
  if(a.dataset.dact==='del'){D.groups.splice(D.sel,1);D.sel=0;lsSet(KEYD,D);showDocente()}
  else if(a.dataset.dact==='acta'){const nota=RUBN.reduce((x,r,i)=>x+g.scores[i]*r[1]/100,0);dl('acta_'+(g.data.meta.grupo||'grupo').replace(/\W+/g,'_')+'.md',`# Acta · ${g.data.meta.grupo}\n\n**Nota ponderada:** ${nota.toFixed(1)} / 20 (${lvl(Math.round(nota))})\n\n`+RUBN.map((r,i)=>`- ${r[0]} (${r[1]}%): ${g.scores[i]}/20 · ${lvl(g.scores[i])}${g.notes[i]?' — '+g.notes[i]:''}`).join('\n')+`\n\n**Pregunta crítica / respuesta:** ${g.notes[4]||'—'}\n`,'text/markdown')}
});

/* ═══════════ arranque ═══════════ */
function route(){
  if(location.hash==='#docente'){document.body.classList.add('docente');showDocente()}
  else{document.body.classList.remove('docente');document.title='Plataforma de Evaluación 1 · Tela Peruana | ZEGEL Metodologías Ágiles';renderView()}
}
window.addEventListener('hashchange',route);
if(!VIEWS[cur])cur='equipo';
route();tick();
</script>
